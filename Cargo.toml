[package]
name = "llmtune"
version = "0.1.0"
edition = "2021"
description = "Public inference engine for the AMD BC-250: discover, launch/swap, benchmark and serve models across one node or a fleet."
license = "GPL-2.0-only"
repository = "https://github.com/cachenetics/llmtune"
readme = "README.md"
keywords = ["bc250", "llm", "llama-cpp", "tui", "benchmark"]
categories = ["command-line-utilities"]

[[bin]]
name = "llmtune"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ureq = { version = "2", features = ["json"] }
tiny_http = "0.12"
regex = "1"
sha2 = "0.10"
libc = "0.2"
ratatui = "0.29"
crossterm = "0.28"
unicode-width = "0.2"

[profile.release]
lto = true
strip = true
codegen-units = 1
