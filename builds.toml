# llmtune llama.cpp build recipes (bundled seed).
#
# Each [[build]] is a named, versioned llama.cpp build that llmtune can install,
# update and roll back for you. `ref` is the git ref to track; every install is
# pinned to the concrete commit it resolves to (the version dir is named by that
# commit), so an install is always reproducible and rollback-able even when `ref`
# is a moving branch.
#
# Recommended practice: once a build is blessed for the BC-250 (gfx1013) by a
# doctor + bench smoke, pin `ref` to that commit/tag. `llmtune build update
# <name> --ref <sha>` pins on demand without editing this file.
#
# A user copy at ~/.config/llmtune/builds.toml fully replaces this seed.

[[build]]
name = "vulkan"
git_url = "https://github.com/ggml-org/llama.cpp"
# MTP, Vulkan and RPC are all upstream since 2026-05-16 (PR #22673), so one build
# covers single-node serving, the MTP speculative draft, and RPC clusters.
#
# PINNED, not tracking bare `master`: an unpinned ref means an upstream rename or
# reorg silently breaks a REINSTALL on a board that was running great (this is
# exactly how the rpc-server -> ggml-rpc-server rename bit us). This commit is
# BC-250-blessed: builds clean with the deps below and serves gfx1013. Move it
# forward deliberately with `llmtune build update vulkan --ref <sha>` after a
# doctor + bench smoke, never by drifting.
ref = "86d86ed4396b4130922f7b9af26e3d9fc11a591b"
cmake_flags = "-DGGML_VULKAN=ON -DGGML_RPC=ON -DLLAMA_CURL=OFF -DCMAKE_BUILD_TYPE=Release"
# REQUIRED binaries only (install fails only if these are missing). The rpc
# worker binary (ggml-rpc-server, was rpc-server) is OPTIONAL: it is copied
# wholesale when built and reported via `rpc_present`, but a single-node box that
# only serves does not need it, so its absence must never fail the install.
out_bins = ["llama-server", "llama-cli"]
